<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Prism — Playable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Bricolage+Grotesque:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #020308; color: #a8f4ff; font-family: "JetBrains Mono", ui-monospace, monospace; overflow: hidden; }
  * { box-sizing: border-box; }
  #root { position: fixed; inset: 0; }
  canvas { display: block; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.25; } }
  @keyframes drift-up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-30px); } }
  @keyframes flash-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse-glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
  .po-btn { cursor: pointer; transition: all .12s; user-select: none; }
  .po-btn:hover { background: rgba(168,244,255,0.12) !important; box-shadow: 0 0 24px rgba(168,244,255,0.35); }
  .po-btn:active { transform: translateY(1px); }
  .shard-card { cursor: pointer; transition: all .15s; }
  .shard-card:hover { transform: translateY(-3px); }
  .shard-card.dim { opacity: 0.45; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="prototype-engine.js"></script>
<script type="text/babel" src="prototype-app.jsx"></script>

</body>
</html>
