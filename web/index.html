<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Prism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Bricolage+Grotesque:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg:      #020308;
        --accent:  #a8f4ff;
        --accent2: #c9a3ff;
        --gold:    #ffd740;
        --red:     #ff6e6e;
        --green:   #66ff88;
        --surface: rgba(168, 244, 255, 0.04);
        --border:  rgba(168, 244, 255, 0.15);
        --dim:     rgba(168, 244, 255, 0.45);
        --faint:   rgba(168, 244, 255, 0.15);
        --glow-sm: 0 0 12px rgba(168, 244, 255, 0.3);
        --glow-md: 0 0 24px rgba(168, 244, 255, 0.25);
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        --font-display: "Bricolage Grotesque", system-ui, sans-serif;
        --text-shadow-hud: 0 1px 4px rgba(0,0,0,1), 0 0 14px rgba(0,0,0,0.85);
      }

      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: var(--font-mono);
        color: var(--accent);
        -webkit-user-select: none;
        user-select: none;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      /* ── Scanline overlay ─────────────────────────── */
      #scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(0, 0, 0, 0.06) 2px,
          rgba(0, 0, 0, 0.06) 4px
        );
      }
      #scanline-sweep {
        position: fixed;
        left: 0; right: 0;
        height: 80px;
        background: linear-gradient(to bottom,
          transparent 0%,
          rgba(168, 244, 255, 0.025) 50%,
          transparent 100%);
        pointer-events: none;
        z-index: 2;
        animation: scan 8s linear infinite;
      }
      @keyframes scan {
        0%   { transform: translateY(-80px); }
        100% { transform: translateY(100vh); }
      }

      /* ── FPS status ───────────────────────────────── */
      #status {
        position: fixed;
        bottom: 4px;
        right: 8px;
        font-size: 9px;
        letter-spacing: 1px;
        opacity: 0.2;
        pointer-events: none;
        z-index: 5;
      }

      /* ── Top system status bar ────────────────────── */
      #sys-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        font-size: 9px;
        letter-spacing: 2px;
        color: rgba(168, 244, 255, 0.45);
        background: linear-gradient(to bottom, rgba(2, 3, 8, 0.65) 0%, rgba(2, 3, 8, 0.0) 100%);
        border-bottom: none;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        pointer-events: none;
        z-index: 6;
      }
      #sys-bar-left  { flex: 1; }
      #sys-bar-mid   { flex: 1; text-align: center; color: rgba(168, 244, 255, 0.30); }
      #sys-bar-right { flex: 1; text-align: right; pointer-events: auto; cursor: pointer; }
      #sys-uplink    { color: #7dffb0; animation: blink 1.6s infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }

      /* ── HUD container ────────────────────────────── */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }

      /* ── No panel background — text floats over canvas ── */
      .hud-panel {
        background: transparent;
        border: none;
      }

      /* ── HP + DASH panel (top-left) ───────────────── */
      #vitals {
        position: absolute;
        top: 38px;
        left: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 160px;
        padding: 10px 12px;
      }
      .vitals-row {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .vitals-label {
        font-size: 8px;
        letter-spacing: 3px;
        color: var(--dim);
        display: flex;
        justify-content: space-between;
        text-shadow: var(--text-shadow-hud);
      }
      #hp-bar {
        height: 5px;
        background: rgba(0,0,0,0.45);
        position: relative;
        overflow: hidden;
      }
      #dash-bar {
        height: 3px;
        background: rgba(0,0,0,0.35);
        position: relative;
        overflow: hidden;
      }
      .vitals-bar {
        height: 4px;
        background: var(--faint);
        position: relative;
        overflow: hidden;
      }
      #hp-fill {
        position: absolute;
        inset: 0;
        width: 100%;
        background: linear-gradient(90deg, #ff4444, #ff9966, #66ff88);
        box-shadow: 0 0 10px rgba(102, 255, 136, 0.4);
        transition: width 120ms ease-out;
      }
      #dash-fill {
        position: absolute;
        inset: 0;
        width: 100%;
        background: linear-gradient(90deg, var(--accent2), var(--accent));
        box-shadow: 0 0 8px rgba(168, 244, 255, 0.5);
        transition: width 80ms linear;
      }
      #dash-hint {
        font-size: 8px;
        letter-spacing: 1px;
        color: var(--faint);
        margin-top: 2px;
        text-shadow: var(--text-shadow-hud);
      }

      /* ── Timer + Wave (top-center) ────────────────── */
      #timer-wrap {
        position: absolute;
        top: 36px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 20px 10px;
      }
      #timer {
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 6px;
        color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 20px rgba(168, 244, 255, 0.5), 0 0 40px rgba(168, 244, 255, 0.2);
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum";
      }
      #wave-label {
        font-size: 9px;
        letter-spacing: 3px;
        color: rgba(255, 174, 108, 0.85);
        text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(255, 174, 108, 0.4);
        margin-bottom: 4px;
      }

      /* ── Boss HP bar ──────────────────────────────── */
      #boss-hud {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        width: min(360px, 58vw);
        display: none;
        text-align: center;
        pointer-events: none;
      }
      #boss-hud.shown { display: block; }
      #boss-name {
        font-size: 9px;
        letter-spacing: 4px;
        color: rgba(255, 220, 170, 0.85);
        text-shadow: 0 0 12px rgba(255, 180, 100, 0.4);
        margin-bottom: 5px;
      }
      #boss-bar {
        height: 6px;
        background: rgba(255, 220, 170, 0.12);
        overflow: hidden;
        clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 6px 100%);
      }
      #boss-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff4f4f, #ffb36c, #fff4c7);
        box-shadow: 0 0 18px rgba(255, 100, 80, 0.8);
        transition: width 100ms linear;
      }

      /* ── Rank + Kills + Synergies (top-right) ────────── */
      #stats {
        position: absolute;
        top: 38px;
        right: 14px;
        text-align: right;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 160px;
        max-width: 220px;
        padding: 10px 12px;
      }
      #rank-label {
        font-size: 9px;
        letter-spacing: 3px;
        color: var(--dim);
        text-shadow: var(--text-shadow-hud);
      }
      #rank {
        font-family: var(--font-display);
        font-size: 32px;
        font-weight: 300;
        letter-spacing: 3px;
        color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 1px 4px rgba(0,0,0,1), var(--glow-sm);
        line-height: 1;
        margin-bottom: 2px;
      }
      #kills {
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--dim);
        text-shadow: var(--text-shadow-hud);
      }
      #synergies-section {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        align-items: flex-end;
      }
      #synergies-label {
        font-size: 8px;
        letter-spacing: 3px;
        color: rgba(168, 244, 255, 0.30);
        margin-bottom: 3px;
        text-shadow: var(--text-shadow-hud);
      }

      /* ── Synergy tags ─────────────────────────────── */
      #synergies-hud {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
      }
      .synergy-tag {
        font-size: 8px;
        letter-spacing: 2px;
        padding: 2px 0;
        transition: opacity 200ms ease, color 200ms ease;
        text-shadow: var(--text-shadow-hud);
      }
      .synergy-tag.active {
        color: var(--gold);
        text-shadow: 0 1px 3px rgba(0,0,0,1), 0 0 8px rgba(255, 215, 64, 0.6);
      }
      .synergy-tag.near {
        color: rgba(168, 244, 255, 0.35);
      }

      /* ── XP bar (bottom-center) ───────────────────── */
      #xp-outer {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 18px;
        width: min(640px, 60vw);
        padding: 8px 12px;
      }
      #xp-label {
        display: flex;
        justify-content: space-between;
        font-size: 8px;
        letter-spacing: 2px;
        color: var(--dim);
        margin-bottom: 4px;
        text-shadow: var(--text-shadow-hud);
      }
      #xp-wrap {
        height: 3px;
        background: rgba(0,0,0,0.4);
        overflow: hidden;
        width: 100%;
      }
      #xp-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #7fd3ff, rgba(255,255,255,0.9));
        box-shadow: 0 0 16px #7fd3ff;
        transition: width 120ms ease-out;
      }

      /* ── Shard tray (bottom-left) ─────────────────── */
      #shards-tray {
        position: absolute;
        left: 14px;
        bottom: 14px;
        display: flex;
        flex-wrap: wrap;
        max-width: 230px;
        gap: 6px;
        align-items: flex-end;
        padding: 8px 10px;
        min-height: 20px;
      }
      .shard-pip-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .shard-pip {
        width: 26px;
        height: 30px;
        clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
        background: transparent;
        border: 1px solid var(--faint);
        transition: box-shadow 200ms ease, background 200ms ease;
      }
      .shard-pip-label {
        font-size: 8px;
        letter-spacing: 1px;
        font-weight: 600;
        line-height: 1;
        text-shadow: var(--text-shadow-hud);
      }

      /* ── Wave clear banner ────────────────────────── */
      #wave-clear {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 18px;
        letter-spacing: 10px;
        font-weight: 300;
        color: var(--accent);
        opacity: 0;
        pointer-events: none;
        transition: opacity 300ms ease-out;
        text-shadow: var(--glow-md);
      }
      #wave-clear.shown { opacity: 0.9; }

      /* ── Corner decorations ───────────────────────── */
      .corner {
        position: fixed;
        width: 24px;
        height: 24px;
        pointer-events: none;
        z-index: 4;
        opacity: 0.35;
      }
      .corner::before, .corner::after {
        content: '';
        position: absolute;
        background: var(--accent);
      }
      .corner::before { width: 100%; height: 1px; top: 0; left: 0; }
      .corner::after  { width: 1px; height: 100%; top: 0; left: 0; }
      .corner-tl { top: 0; left: 0; }
      .corner-tr { top: 0; right: 0; transform: scaleX(-1); }
      .corner-bl { bottom: 0; left: 0; transform: scaleY(-1); }
      .corner-br { bottom: 0; right: 0; transform: scale(-1); }

      /* ── Shared overlay base ──────────────────────── */
      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 30;
        background: rgba(2, 3, 8, 0.75);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        animation: fade-in 220ms ease-out;
      }
      .overlay.shown { display: flex; }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Level-up overlay ─────────────────────────── */
      #levelup {
        gap: 24px;
        padding: 24px 20px;
        overflow-y: auto;
      }
      #levelup-title {
        font-size: 9px;
        letter-spacing: 6px;
        color: var(--dim);
      }
      #levelup-rank {
        font-family: var(--font-display);
        font-size: 42px;
        font-weight: 300;
        letter-spacing: 4px;
        color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 0 32px rgba(168, 244, 255, 0.5);
      }
      #levelup-cards {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 0 16px;
      }

      /* ── Shard card ───────────────────────────────── */
      .shard-card {
        width: 210px;
        min-height: 240px;
        padding: 20px 18px;
        border: 1px solid var(--border);
        border-radius: 2px;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        gap: 10px;
        cursor: pointer;
        transition: transform 180ms ease, border-color 200ms ease, box-shadow 220ms ease, background 200ms ease;
        font-family: var(--font-mono);
        text-align: left;
        color: var(--accent);
        position: relative;
        overflow: hidden;
      }
      .shard-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0;
        transition: opacity 200ms ease;
      }
      .shard-card:hover, .shard-card:focus {
        transform: translateY(-4px);
        outline: none;
        border-color: rgba(168, 244, 255, 0.4);
        background: rgba(168, 244, 255, 0.08);
        box-shadow: 0 0 28px rgba(168, 244, 255, 0.15), inset 0 0 20px rgba(168, 244, 255, 0.04);
      }
      .shard-card:hover::before { opacity: 1; }

      .shard-icon {
        width: 44px;
        height: 50px;
        clip-path: polygon(50% 0%, 100% 27%, 100% 73%, 50% 100%, 0% 73%, 0% 27%);
        box-shadow: 0 0 18px currentColor, inset 0 0 12px rgba(0,0,0,0.4);
        flex-shrink: 0;
      }
      .shard-rarity {
        font-size: 7px;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 2px;
      }
      .shard-rarity.common    { color: rgba(168,244,255,0.35); }
      .shard-rarity.rare      { color: #7fd3ff; text-shadow: 0 0 6px rgba(127,211,255,0.5); }
      .shard-rarity.legendary { color: var(--gold); text-shadow: 0 0 8px rgba(255,215,64,0.6); }
      .shard-rarity.evolution { color: #ffb547; text-shadow: 0 0 12px rgba(255,181,71,0.7); }

      .shard-name {
        font-size: 12px;
        letter-spacing: 4px;
        font-weight: 500;
        color: var(--accent);
      }
      .shard-level {
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--dim);
      }
      .shard-desc {
        font-size: 10px;
        line-height: 1.65;
        color: var(--dim);
        flex: 1;
      }
      .shard-synergy {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 9px;
        color: #c9ffa3;
        letter-spacing: 0.5px;
      }
      .shard-synergy span {
        padding-left: 8px;
        border-left: 2px solid currentColor;
        opacity: 0.8;
      }
      .shard-hotkey {
        margin-top: auto;
        font-size: 9px;
        letter-spacing: 3px;
        color: var(--faint);
      }

      /* ── Level-up action buttons ──────────────────── */
      .levelup-action {
        margin-top: 6px;
        padding: 9px 28px;
        border: 1px solid var(--border);
        border-radius: 1px;
        background: transparent;
        color: var(--dim);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 3px;
        cursor: pointer;
        transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
      }
      .levelup-action:hover:not(:disabled) {
        color: var(--accent);
        border-color: rgba(168, 244, 255, 0.4);
        background: rgba(168, 244, 255, 0.06);
      }
      .levelup-action:disabled {
        opacity: 0.2;
        cursor: default;
      }

      /* ── Death / victory overlay ──────────────────── */
      #death-screen {
        gap: 16px;
        padding: 32px 16px;
        overflow-y: auto;
        z-index: 40;
      }
      #death-title {
        font-family: var(--font-display);
        font-size: 88px;
        font-weight: 300;
        letter-spacing: 14px;
        color: var(--red);
        text-shadow: 0 0 36px rgba(255, 110, 110, 0.5), 0 0 80px rgba(255, 110, 110, 0.25);
        line-height: 1;
      }
      .victory-title {
        color: var(--green) !important;
        text-shadow: 0 0 36px rgba(102, 255, 136, 0.5) !important, 0 0 80px rgba(102, 255, 136, 0.25) !important;
      }
      #death-score {
        font-family: var(--font-display);
        font-size: 40px;
        font-weight: 300;
        letter-spacing: 3px;
        color: rgba(255, 255, 255, 0.7);
        text-shadow: var(--glow-md);
        line-height: 1;
      }
      #death-stats {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--dim);
        text-align: center;
        line-height: 2;
        width: min(680px, calc(100vw - 32px));
        max-height: min(55vh, 480px);
        overflow-y: auto;
      }
      .best-run-panel {
        margin: 14px auto 0;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        color: rgba(168, 244, 255, 0.4);
        line-height: 1.8;
      }
      .best-run-title {
        color: var(--accent);
        letter-spacing: 5px;
        font-size: 9px;
        margin-bottom: 6px;
      }
      .best-run-line { white-space: normal; }
      .best-run-line.current-run {
        color: var(--gold);
        text-shadow: 0 0 8px rgba(255, 215, 64, 0.4);
      }
      #death-restart {
        margin-top: 8px;
        padding: 12px 40px;
        border: 1px solid var(--border);
        border-radius: 1px;
        background: var(--surface);
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 5px;
        cursor: pointer;
        transition: all 180ms ease;
        pointer-events: auto;
        text-shadow: var(--glow-sm);
      }
      #death-restart:hover {
        border-color: rgba(168, 244, 255, 0.5);
        background: rgba(168, 244, 255, 0.1);
        box-shadow: var(--glow-md);
      }
      #death-hint {
        font-size: 8px;
        letter-spacing: 3px;
        color: var(--faint);
      }

      /* ── Pause menu ───────────────────────────────── */
      #pause-menu {
        gap: 20px;
        z-index: 50;
      }
      #pause-title {
        font-family: var(--font-display);
        font-size: 20px;
        letter-spacing: 10px;
        color: var(--accent);
        text-shadow: var(--glow-md);
      }
      .pause-btn {
        padding: 12px 40px;
        border: 1px solid var(--border);
        border-radius: 1px;
        background: var(--surface);
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 4px;
        cursor: pointer;
        transition: all 150ms ease;
        pointer-events: auto;
      }
      .pause-btn:hover {
        border-color: rgba(168, 244, 255, 0.5);
        background: rgba(168, 244, 255, 0.1);
        box-shadow: var(--glow-sm);
      }

      /* ── Scrollbar ────────────────────────────────── */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- Visual overlays -->
    <div id="scanlines" aria-hidden="true"></div>
    <div id="scanline-sweep" aria-hidden="true"></div>
    <div class="corner corner-tl" aria-hidden="true"></div>
    <div class="corner corner-tr" aria-hidden="true"></div>
    <div class="corner corner-bl" aria-hidden="true"></div>
    <div class="corner corner-br" aria-hidden="true"></div>

    <!-- Top system bar -->
    <div id="sys-bar" aria-hidden="true">
      <span id="sys-bar-left">PRISM-OS v0.9.4 · NODE-7F2</span>
      <span id="sys-bar-mid">SECTOR 04 / GLOBE 11</span>
      <span id="sys-bar-right"><span id="sys-uplink">● UPLINK STABLE</span></span>
    </div>

    <div id="status">loading…</div>

    <!-- HUD -->
    <div id="hud">
      <!-- Top-left: HP + Dash -->
      <div id="vitals" class="hud-panel">
        <div class="vitals-row">
          <div class="vitals-label"><span>HULL</span><span id="hp-val">— / —</span></div>
          <div id="hp-bar"><div id="hp-fill"></div></div>
        </div>
        <div class="vitals-row">
          <div class="vitals-label"><span>DASH</span><span id="dash-status">READY</span></div>
          <div id="dash-bar"><div id="dash-fill"></div></div>
          <div id="dash-hint">[SPACE · 2× TAP]</div>
        </div>
      </div>

      <!-- Top-center: Wave + Timer -->
      <div id="timer-wrap" class="hud-panel">
        <div id="wave-label">WAVE 1</div>
        <div id="timer">0:00</div>
      </div>

      <!-- Boss HP -->
      <div id="boss-hud">
        <div id="boss-name">PRISM SENTINEL</div>
        <div id="boss-bar"><div id="boss-fill"></div></div>
      </div>

      <!-- Top-right: Rank + Kills + Synergies -->
      <div id="stats" class="hud-panel">
        <div id="rank-label">RANK</div>
        <div id="rank">0</div>
        <div id="kills">0 KILLS</div>
        <div id="synergies-section">
          <div id="synergies-label">// SYNERGIES</div>
          <div id="synergies-hud"></div>
        </div>
      </div>

      <!-- Bottom-center: XP bar -->
      <div id="xp-outer" class="hud-panel">
        <div id="xp-label">
          <span id="xp-rank-label">RADIANCE</span>
          <span id="xp-val"></span>
        </div>
        <div id="xp-wrap"><div id="xp-fill"></div></div>
      </div>

      <!-- Bottom-left: Shard tray -->
      <div id="shards-tray" class="hud-panel"></div>
    </div>

    <!-- Wave clear -->
    <div id="wave-clear">// WAVE CLEAR</div>

    <!-- Level-up overlay -->
    <div id="levelup" class="overlay">
      <div id="levelup-title">// FREQUENCY UPGRADE</div>
      <div id="levelup-rank">—</div>
      <div id="levelup-cards"></div>
    </div>

    <!-- Death / Victory overlay -->
    <div id="death-screen" class="overlay">
      <div id="death-title">SHATTERED</div>
      <div id="death-score">0</div>
      <div id="death-stats"></div>
      <button id="death-restart">PLAY AGAIN</button>
      <div id="death-hint">SPACE / TAP</div>
    </div>

    <!-- Pause overlay -->
    <div id="pause-menu" class="overlay">
      <div id="pause-title">PAUSED</div>
      <button id="btn-resume" class="pause-btn">RESUME</button>
      <button id="btn-toggle-sound" class="pause-btn">SOUND: ON</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
