name = "prism"
main = "./worker/index.js"
compatibility_date = "2026-04-17"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "GHOST_ROSTER"
class_name = "GhostRoster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GhostRoster"]
